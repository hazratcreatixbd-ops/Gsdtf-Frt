name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/* android/app/src/main/assets/dist/
          test -f android/app/src/main/assets/dist/index.html

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          # Ensure gradle-wrapper.jar is present or generated if needed
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper jar..."
            gradle wrapper --gradle-version 8.5 || true
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          echo "Inspecting Gradle build outputs under android/..."
          ACTUAL_APK=$(find android -type f -name "*-debug.apk" | head -n 1)
          if [ -z "$ACTUAL_APK" ]; then
            ACTUAL_APK=$(find android -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$ACTUAL_APK" ]; then
            echo "❌ No APK file found anywhere under android/!"
            find android/app/build -maxdepth 4 2>/dev/null || true
            exit 1
          fi
          echo "Actual Gradle APK output path: $ACTUAL_APK"
          TARGET_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$(dirname "$TARGET_APK")"
          if [ "$ACTUAL_APK" != "$TARGET_APK" ]; then
            echo "Normalizing APK from $ACTUAL_APK to $TARGET_APK..."
            cp -f "$ACTUAL_APK" "$TARGET_APK"
          fi
          if [ -s "$TARGET_APK" ]; then
            APK_SIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || wc -c < "$TARGET_APK")
            echo "✅ APK verified at $TARGET_APK (Size: ${APK_SIZE} bytes)"
            ls -lh "$TARGET_APK"
          else
            echo "❌ APK file is missing or zero bytes at $TARGET_APK!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
