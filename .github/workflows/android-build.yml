name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Application
        run: |
          npm ci || npm install
          npm run build

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          # Ensure gradle-wrapper.jar is present or generated if needed
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper jar..."
            gradle wrapper --gradle-version 8.5 || true
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generated
        run: |
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK generated successfully at android/app/build/outputs/apk/debug/app-debug.apk"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK file not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
